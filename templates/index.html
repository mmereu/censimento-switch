{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card search-card shadow-sm">
            <div class="card-body p-4">
                <h4 class="card-title mb-3">Ricerca Apparati per Rete</h4>
                <form id="searchForm" class="d-flex gap-2">
                    <input type="text" id="networkInput" class="form-control form-control-lg"
                           placeholder="es. 10.31.4.0 o 10.31.104.0/24" autocomplete="off">
                    <button type="submit" class="btn btn-primary btn-lg px-4" id="btnSearch">Cerca</button>
                </form>
                <div class="mt-2">
                    <small class="text-muted">Esempi: </small>
                    <a href="#" class="example-link badge bg-light text-primary me-1" data-network="10.31.4.0">10.31.4.0</a>
                    <a href="#" class="example-link badge bg-light text-primary me-1" data-network="10.31.104.0">10.31.104.0</a>
                    <a href="#" class="example-link badge bg-light text-primary me-1" data-network="10.31.5.0">10.31.5.0</a>
                    <a href="#" class="example-link badge bg-light text-primary me-1" data-network="10.31.105.0">10.31.105.0</a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Alert errori -->
<div id="alertContainer" class="row justify-content-center mt-3" style="display:none;">
    <div class="col-lg-8">
        <div id="alertMsg" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span id="alertText"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    </div>
</div>

<!-- Loading spinner -->
<div id="loadingSpinner" class="text-center mt-4" style="display:none;">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Caricamento...</span>
    </div>
    <p class="text-muted mt-2">Ricerca in corso...</p>
</div>

<!-- Risultati -->
<div id="resultsSection" class="mt-4" style="display:none;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">
            Risultati: <span id="resultCount" class="badge bg-primary">0</span>
        </h5>
        <div id="exportButtons" class="d-flex gap-2">
            <button class="btn btn-outline-success btn-sm" id="btnExportCsv">
                Export CSV
            </button>
            <button class="btn btn-outline-success btn-sm" id="btnExportExcel">
                Export Excel
            </button>
        </div>
    </div>
    <div class="table-responsive">
        <table id="resultsTable" class="table table-striped table-hover" style="width:100%">
            <thead class="table-primary">
                <tr>
                    <th>Nome Switch</th>
                    <th>Marca</th>
                    <th>Modello</th>
                    <th>IP</th>
                    <th>Seriale</th>
                    <th>Posizione</th>
                    <th>Stack</th>
                    <th>Porte Up</th>
                    <th>Porte Down</th>
                </tr>
            </thead>
            <tbody id="resultsBody">
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
